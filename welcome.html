<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — WA Media Downloader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: orbFloat 6s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #25d366 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #6c3fc5 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-delay: 3s;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 30px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.35);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      border-radius: 99px;
    }

    .emoji {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #25d366;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      border-radius: 99px;
      padding: 3px 12px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .message {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .message strong {
      color: #ffffff;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }

    .kofi-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
      padding: 14px;
      background: linear-gradient(135deg,
        rgba(37, 211, 102, 0.35),
        rgba(18, 140, 126, 0.35));
      border: 1px solid rgba(37, 211, 102, 0.5);
      border-top-color: rgba(37, 211, 102, 0.7);
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 4px 16px rgba(37, 211, 102, 0.2);
      margin-bottom: 10px;
    }

    .kofi-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 8px 24px rgba(37, 211, 102, 0.3);
    }

    .skip-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s ease;
      width: 100%;
    }

    .skip-btn:hover {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">📥</span>
    <h1>WA Media Downloader</h1>
    <span class="badge">✨ Successfully Installed</span>

    <p class="message">
      This tool is <strong>free, and always will be.</strong><br/>
      If it saved you time, a small coffee means the world.<br/>
      Thank you. 🙏
    </p>

    <div class="divider"></div>

    <a class="kofi-btn" href="https://ko-fi.com/renzluigi" target="_blank">
      ☕ Support on Ko-fi
    </a>

    <button class="skip-btn" onclick="window.close()">
      Maybe later →
    </button>
  </div>
</body>
</html>
